name: Quality checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
          check-latest: true
          cache: npm
      - run: npm install --global npm@11.20.0
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=1 --retries=0

  linux-browser-acceptance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
          check-latest: true
          cache: npm
      - run: npm install --global npm@11.20.0
      - run: node --version
      - run: npm --version
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run build
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .visual-baseline
      - run: npm ci
        working-directory: .visual-baseline
      - run: npm run build
        working-directory: .visual-baseline
      - name: Compare upgraded UI with the pull request base
        run: npm run test:visual-diff
        env:
          MODERNIZATION_BASELINE_DIR: ${{ github.workspace }}/.visual-baseline
          MODERNIZATION_BASELINE_SHA: ${{ github.event.pull_request.base.sha }}
          MODERNIZATION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MODERNIZATION_VISUAL_RESULTS: ${{ github.workspace }}/.visual-regression-results
      - name: Run Firefox acceptance paths
        run: npm run test:e2e -- --config playwright.firefox.config.ts --workers=1 --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-visual-regression
          path: .visual-regression-results
          if-no-files-found: ignore
