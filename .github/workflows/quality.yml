name: Quality checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  workflow_dispatch:
    inputs:
      run_d2_s1_browser_acceptance:
        description: Run the D2-S1 Linux Chromium acceptance suite
        required: false
        type: boolean
        default: false
      run_d2_s1_diagnostics:
        description: Run independent D2-S1 product diagnostics before the formal quality gate
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        node: ['24.22.1', '26.11.1']
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm
      - run: npm install --global npm@11.20.0
      - run: node --version && npm --version
      - id: install-dependencies
        run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - id: build
        run: npm run build
      - name: Install Playwright Chromium and Linux dependencies
        id: install-chromium
        run: npx playwright install --with-deps chromium
      - name: Run standard Chromium regression with PC Studio disabled
        id: chromium-gate-off
        run: npm run test:e2e -- --config playwright.quality-gate-off.config.ts --workers=1 --retries=0 --output=test-results/quality-gate-off
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/quality-gate-off/report.json
          VITE_ENABLE_PC_STUDIO: 'false'
      - name: Run PC Studio Chromium regression with feature gate enabled
        id: chromium-gate-on
        if: ${{ always() && !cancelled() && steps.install-dependencies.outcome == 'success' && steps.build.outcome == 'success' && steps.install-chromium.outcome == 'success' }}
        run: >-
          npm run test:e2e -- --workers=1 --retries=0
          --output=test-results/quality-gate-on --grep-invert @d2-s1
          e2e/ai-dock-scroll.spec.ts e2e/pc-d1-studio.spec.ts
          e2e/pc-d4-template-center.spec.ts
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/quality-gate-on/report.json
          VITE_ENABLE_PC_STUDIO: 'true'
      - uses: actions/upload-artifact@v7
        if: ${{ always() && steps.install-chromium.outcome == 'success' }}
        with:
          name: quality-chromium-${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/quality-gate-off/**
            test-results/quality-gate-on/**
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: ${{ always() && github.event_name == 'pull_request' && startsWith(github.head_ref, 'design/phase4b-') }}
        with:
          name: phase4b-studio-visual-review-${{ matrix.node }}
          path: test-results/**/phase4b-*.png
          if-no-files-found: ignore
          retention-days: 14

  d2-s1-early-diagnostics:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_d2_s1_diagnostics }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        node: ['24.22.1', '26.11.1']
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm
      - run: npm install --global npm@11.20.0
      - run: node --version && npm --version
      - id: install-dependencies
        run: npm ci
      - name: Install Playwright Chromium and Linux dependencies
        id: install-chromium
        if: ${{ always() && steps.install-dependencies.outcome == 'success' }}
        run: npx playwright install --with-deps chromium
      - name: Build candidate for diagnostic context
        id: build-candidate
        if: ${{ always() && steps.install-dependencies.outcome == 'success' }}
        run: npm run build
        env:
          VITE_ENABLE_PC_STUDIO: 'true'
      - name: Repeat deterministic AI Dock SSE E2E five times
        id: diagnostic-sse-repeat
        if: ${{ always() && steps.install-dependencies.outcome == 'success' && steps.install-chromium.outcome == 'success' }}
        run: >-
          npm run test:e2e -- --workers=1 --retries=0 --repeat-each=5
          --output=test-results/d2-s1-sse-repeat
          --grep "AI Dock runs the official inline controller with a local test SSE endpoint"
          e2e/pc-d1-studio.spec.ts
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/d2-s1-sse-repeat/report.json
          VITE_ENABLE_PC_STUDIO: 'true'
      - name: Run Focus, SSE, Header, and D2-S1 Gate ON diagnostics
        id: diagnostic-gate-on
        if: ${{ always() && steps.install-dependencies.outcome == 'success' && steps.install-chromium.outcome == 'success' }}
        run: >-
          npm run test:e2e -- --workers=1 --retries=0
          --output=test-results/d2-s1-diagnostic-on
          e2e/ai-dock-scroll.spec.ts e2e/pc-d1-studio.spec.ts
          e2e/pc-d4-template-center.spec.ts
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/d2-s1-diagnostic-on/report.json
          VITE_ENABLE_PC_STUDIO: 'true'
      - name: Verify Gate OFF fallback and isolation
        id: diagnostic-gate-off
        if: ${{ always() && steps.install-dependencies.outcome == 'success' && steps.install-chromium.outcome == 'success' }}
        run: >-
          npm run test:e2e -- --config playwright.quality-gate-off.config.ts
          --workers=1 --retries=0 --output=test-results/d2-s1-diagnostic-off
          e2e/pc-d4-template-center.spec.ts e2e/pc-d1-gate-off.spec.ts
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/d2-s1-diagnostic-off/report.json
          VITE_ENABLE_PC_STUDIO: 'false'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: d2-s1-early-diagnostic-${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/pc-d4-d2/d2-s1/screenshots/**
            artifacts/pc-d4-d2/d2-s1/visual-matrix/**
            test-results/d2-s1-diagnostic-on/**
            test-results/d2-s1-diagnostic-off/**
            test-results/d2-s1-sse-repeat/**
          if-no-files-found: warn
          retention-days: 14

  d2-s1-chromium-acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_d2_s1_browser_acceptance }}
    needs: quality
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '26.11.1'
          check-latest: true
          cache: npm
      - run: npm install --global npm@11.20.0
      - run: node --version
      - run: npm --version
      - run: npm ci
      - name: Install Playwright Chromium and Linux dependencies
        id: install-chromium
        run: npx playwright install --with-deps chromium
      - name: Run D2-S1 Chromium acceptance with PC Studio enabled
        run: npm run test:e2e -- --workers=1 --retries=0 --output=test-results/d2-s1-gate-on --grep @d2-s1 e2e/pc-d4-template-center.spec.ts
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/d2-s1-gate-on/report.json
          VITE_ENABLE_PC_STUDIO: 'true'
      - name: Verify the PC Studio feature gate remains closed
        if: ${{ always() && steps.install-chromium.outcome == 'success' }}
        run: npm run test:e2e -- --workers=1 --retries=0 --output=test-results/d2-s1-gate-off e2e/pc-d4-template-center.spec.ts e2e/pc-d1-gate-off.spec.ts
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/d2-s1-gate-off/report.json
          VITE_ENABLE_PC_STUDIO: 'false'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: d2-s1-chromium-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/pc-d4-d2/d2-s1/screenshots/**
            artifacts/pc-d4-d2/d2-s1/visual-matrix/**
            test-results/**
          if-no-files-found: warn
          retention-days: 14

  linux-firefox-acceptance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          check-latest: true
          cache: npm
      - run: npm install --global npm@11.20.0
      - run: node --version
      - run: npm --version
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - run: npm run build
      - name: Run Firefox acceptance paths
        run: npm run test:e2e -- --config playwright.firefox.config.ts --workers=1 --retries=0

  visual-parity:
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'visual-parity') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          check-latest: true
          cache: npm
      - run: npm install --global npm@11.20.0
      - run: node --version
      - run: npm --version
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .visual-baseline
      - run: npm ci
        working-directory: .visual-baseline
      - run: npm run build
        working-directory: .visual-baseline
      - name: Compare upgraded UI with the pull request base
        run: npm run test:visual-diff
        env:
          MODERNIZATION_BASELINE_DIR: ${{ github.workspace }}/.visual-baseline
          MODERNIZATION_BASELINE_SHA: ${{ github.event.pull_request.base.sha }}
          MODERNIZATION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MODERNIZATION_VISUAL_RESULTS: ${{ github.workspace }}/visual-regression-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-visual-regression
          path: visual-regression-results
          if-no-files-found: ignore
