name: Quality checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          check-latest: true
          cache: npm
      - run: npm install --global npm@11.20.0
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=1 --retries=0
        env:
          M0_GEOMETRY_HEAD: ${{ github.sha }}
      - uses: actions/upload-artifact@v7
        if: ${{ always() && github.event_name == 'pull_request' && startsWith(github.head_ref, 'design/phase4b-') }}
        with:
          name: phase4b-studio-visual-review
          path: test-results/**/phase4b-*.png
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: ${{ always() && github.event_name == 'pull_request' && startsWith(github.head_ref, 'design/mobile-compact-studio-m0') }}
        with:
          name: mobile-compact-studio-m0-visual-review
          path: test-results/mobile-compact-studio-m0/**
          if-no-files-found: warn
          retention-days: 14

  linux-firefox-acceptance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          check-latest: true
          cache: npm
      - run: npm install --global npm@11.20.0
      - run: node --version
      - run: npm --version
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - run: npm run build
      - name: Run Firefox acceptance paths
        run: npm run test:e2e -- --config playwright.firefox.config.ts --workers=1 --retries=0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: firefox-mobile-compact-studio-m0-smoke
          path: test-results/mobile-compact-studio-m0/m0-smoke-firefox-*.png
          if-no-files-found: ignore
          retention-days: 14

  visual-parity:
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'visual-parity') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          check-latest: true
          cache: npm
      - run: npm install --global npm@11.20.0
      - run: node --version
      - run: npm --version
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .visual-baseline
      - run: npm ci
        working-directory: .visual-baseline
      - run: npm run build
        working-directory: .visual-baseline
      - name: Compare upgraded UI with the pull request base
        run: npm run test:visual-diff
        env:
          MODERNIZATION_BASELINE_DIR: ${{ github.workspace }}/.visual-baseline
          MODERNIZATION_BASELINE_SHA: ${{ github.event.pull_request.base.sha }}
          MODERNIZATION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MODERNIZATION_VISUAL_RESULTS: ${{ github.workspace }}/visual-regression-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-visual-regression
          path: visual-regression-results
          if-no-files-found: ignore
